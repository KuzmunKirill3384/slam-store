name: Тесты
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker
        working-directory: worker
        run: npm test
      - name: Витрина
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
